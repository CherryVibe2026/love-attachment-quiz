<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>测测你的恋爱依恋模式｜15 题算出依恋类型 + 恋爱脑指数</title>
<style>
  :root{
    --bg:#F7F5F1;        /* 页面底色 */
    --card:#FFFFFF;      /* 卡片 */
    --ink:#3F3A35;       /* 主文字 */
    --ink2:#857D75;      /* 次级文字 */
    --ink3:#A79E95;      /* 弱化文字 */
    --line:#EAE5DF;      /* 描边 */
    --accent:#8FA792;    /* 主色（鼠尾草绿） */
    --accent-soft:#E9EFE9;
    --accent-2:#C7A79B;  /* 点缀色（藕粉） */
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    font-size:16px;line-height:1.7;letter-spacing:.02em;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:480px;margin:0 auto;padding:0 20px 48px;}

  /* 封面 */
  .cover{padding-top:64px;text-align:center;}
  .cover .eyebrow{display:inline-block;font-size:12px;letter-spacing:.18em;color:var(--accent-2);
    border:1px solid #E9DFD8;border-radius:999px;padding:5px 14px;margin-bottom:22px;background:#FBF8F5;}
  .cover h1{font-size:27px;line-height:1.5;font-weight:600;margin:0 0 6px;letter-spacing:.04em;}
  .cover h1 em{font-style:normal;color:var(--accent);}
  .cover .sub{font-size:14px;color:var(--ink2);margin:0 0 26px;}
  .cover .lead{text-align:left;font-size:14.5px;color:var(--ink2);line-height:1.9;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:22px;}
  .meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:30px;}
  .meta span{font-size:12px;color:var(--ink2);background:#F1EDE8;border-radius:999px;padding:5px 12px;}
  .foot{text-align:center;font-size:12px;color:var(--ink3);margin-top:18px;}

  /* 按钮 */
  .btn{display:block;width:100%;border:none;border-radius:999px;cursor:pointer;font-family:inherit;
    font-size:16px;letter-spacing:.06em;padding:15px 0;background:var(--accent);color:#fff;font-weight:500;}
  .btn:active{opacity:.85;}
  .btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);}
  .btn:disabled{background:#DCD6CF;color:#fff;cursor:default;}

  /* 答题 */
  .topbar{padding-top:26px;}
  .ptop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .ptop .num{font-size:12px;color:var(--ink3);letter-spacing:.14em;}
  .ptop .back{font-size:13px;color:var(--ink3);cursor:pointer;border:none;background:none;font-family:inherit;padding:0;}
  .bar{height:4px;background:#EDE8E2;border-radius:999px;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,#B7C8B9,var(--accent));transition:width .28s ease;}
  .qtitle{font-size:20px;line-height:1.6;font-weight:600;margin:34px 0 4px;letter-spacing:.03em;}
  .qhint{font-size:13px;color:var(--ink3);margin:0 0 24px;}
  .opts{display:flex;flex-direction:column;gap:12px;}
  .opt{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:15px 16px;cursor:pointer;font-size:15px;line-height:1.65;color:var(--ink);
    transition:background .18s ease,border-color .18s ease;}
  .opt .dot{flex:0 0 18px;width:18px;height:18px;border-radius:50%;border:1px solid #DAD3CB;margin-top:4px;position:relative;}
  .opt .txt{flex:1;}
  .opt.on{border-color:var(--accent);background:var(--accent-soft);}
  .opt.on .dot{border-color:var(--accent);background:var(--accent);}
  .opt.on .dot:after{content:"";position:absolute;left:5px;top:5px;width:6px;height:6px;border-radius:50%;background:#fff;}
  .nav{display:flex;gap:12px;margin-top:28px;}
  .nav .btn{flex:1;}
  .nav .btn.sm{flex:0 0 96px;}

  /* 结果 */
  .rtop{text-align:center;padding-top:56px;}
  .rtop .eyebrow{font-size:12px;letter-spacing:.18em;color:var(--ink3);}
  .city{font-size:34px;font-weight:600;letter-spacing:.06em;margin:10px 0 2px;}
  .citysub{font-size:13px;color:var(--ink2);letter-spacing:.08em;}
  .pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px;}
  .pill{display:inline-block;font-size:13px;color:var(--accent);
    background:var(--accent-soft);border-radius:999px;padding:6px 16px;letter-spacing:.06em;}
  .pill.alt{background:#F5EDE8;color:#B0806C;}
  .tags{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:18px 0 22px;}
  .tags span{font-size:12.5px;color:var(--ink2);background:#F2EEE9;border-radius:999px;padding:6px 13px;}
  .idxbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:20px;text-align:left;}
  .idx-hd{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;color:var(--ink2);}
  .idx-hd b{font-size:26px;color:var(--accent-2);font-weight:600;}
  .idx-bar{height:8px;background:#F0EDE8;border-radius:999px;overflow:hidden;margin:10px 0 8px;}
  .idx-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#D8BBAF,var(--accent-2));border-radius:999px;}
  .idxbox p{font-size:13px;color:var(--ink2);margin:0;line-height:1.7;}
  .quote{background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:24px 22px;margin-bottom:22px;font-size:15px;line-height:2;color:#4A443E;}
  .quote .hd{font-size:12px;letter-spacing:.16em;color:var(--accent-2);margin-bottom:10px;}
  .shot{text-align:center;font-size:12px;color:var(--ink3);margin:14px 0 26px;}
  .alt{background:#FBF8F5;border:1px dashed #E3DCD3;border-radius:var(--radius);padding:16px 18px;margin-bottom:26px;}
  .alt .hd{font-size:12px;letter-spacing:.14em;color:var(--ink3);margin-bottom:10px;}
  .alt .row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:14.5px;}
  .alt .row i{font-style:normal;font-size:12.5px;color:var(--ink3);}
  .acts{display:flex;flex-direction:column;gap:12px;}
  .toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:rgba(63,58,53,.92);
    color:#fff;font-size:13px;padding:9px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s ease;}
  .toast.show{opacity:1;}
  .fade{opacity:0;transition:opacity .22s ease;}
  .fade.in{opacity:1;}
  .hide{display:none;}

  /* 完整解读报告：把 【板块】 标记渲染成带小标题的分板块报告 */
  .cp-block{margin:0 0 22px;}
  .cp-block:last-child{margin-bottom:0;}
  .cp-h{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;
    color:var(--accent);font-weight:600;margin:0 0 10px;}
  .cp-h:before{content:"";display:inline-block;width:14px;height:1px;background:var(--accent);}
  .cp-p{font-size:14.5px;line-height:1.95;color:#4A443E;}
  .cp-t{margin:0 0 2px;}
  .cp-li{position:relative;padding-left:17px;margin:5px 0;}
  .cp-li:before{content:"";position:absolute;left:2px;top:.78em;width:5px;height:5px;
    border-radius:50%;background:var(--accent-2);}
  .cp-quote .cp-p{font-size:16px;font-weight:600;line-height:1.8;color:var(--ink);
    background:#F7F3EE;border-left:3px solid var(--accent-2);border-radius:0 10px 10px 0;padding:12px 15px;}
</style>
</head>
<body>
<div class="wrap">

  <section id="s-cover">
    <div class="cover">
      <div class="eyebrow">ATTACHMENT · 恋爱依恋测试</div>
      <h1>测测你的<em>恋爱依恋模式</em><br>顺便算算恋爱脑指数</h1>

    <div class="alt" id="alt-box">

    <div class="acts">

</div>

<script>

   g* 为依恋大类的「硬门槛」计数维度，只参与门控，不进余弦。 */
const QUESTIONS = [
  { q:"对方半天没回消息，你的第一反应是？", o:[

    { t:"想问又怕显得太黏，最后什么都没发", w:{anx:2,avo:2,conf:-1,gFear:3} }
  ]},
  { q:"刚认识、聊得来，你多久开始想「以后」？", o:[
    { t:"先处着，合不合适看三个月再说", w:{sec:2,ideal:-2,imp:-2,bound:2,gSec:1} },
    { t:"当晚连过年去谁家都快想好了", w:{imp:3,ideal:3,rom:2,anx:1,gAnx:1} },

    { t:"先低头，怕冷战拖久关系就没了", w:{anx:2,sac:3,conf:-1,verify:1,gAnx:1} },
    { t:"自己待一晚，第二天当没事发生", w:{avo:3,solo:2,conf:-2,expr:-2,gAvo:2} },

  { q:"「报备行程」这件事，你怎么看？", o:[
    { t:"顺手说一声挺好的，不强制", w:{sec:2,expr:2,bound:1,gSec:1} },
    { t:"希望彼此主动说，不然会瞎想", w:{verify:3,anx:2,expr:1,gAnx:2} },
    { t:"不太需要，各过各的更舒服", w:{avo:2,bound:3,solo:2,gAvo:2} },
    { t:"想被报备，又怕自己显得太黏", w:{anx:2,bound:2,expr:-1,gFear:2} }
  ]},
  { q:"最舒服的恋爱周末长什么样？", o:[
    { t:"一起买菜做饭，各留半天做自己的事", w:{sec:2,bound:2,solo:1,rom:1,gSec:1} },
    { t:"从早到晚黏着，最好实时同步", w:{anx:2,sac:1,solo:-2,rom:2,gAnx:1} },
    { t:"各忙各的，晚上碰个头就够", w:{avo:2,solo:3,bound:2,gAvo:2} },
    { t:"约好了又想改，改完又有点后悔", w:{avo:1,anx:1,imp:1,gFear:2} }
  ]},
  { q:"对方说「我们需要谈谈」，你脑子里第一句是：", o:[
    { t:"好，正好我也有话想说", w:{conf:2,sec:2,expr:2,gSec:1} },
    { t:"是不是我哪里做错了", w:{anx:3,verify:2,sac:1,gAnx:2} },
    { t:"有点烦，先别现在说", w:{avo:2,conf:-1,solo:1,gAvo:2} },
    { t:"怕听到坏消息，又想赶紧确认", w:{anx:2,avo:1,gFear:3} }
  ]},
  { q:"「我需要你」这句话，你怎么出口？", o:[
    { t:"想说就直接说，不绕弯", w:{expr:3,sec:2,conf:1,gSec:1} },
    { t:"憋着，等对方自己猜到", w:{anx:2,expr:-2,verify:1,gAnx:1} },

    { t:"有点闷，想多留点自己的空间", w:{avo:3,solo:2,bound:2,gAvo:2} },

    { t:"有最好，没有也不慌，商量着来", w:{sec:2,rom:1,bound:1,gSec:1} },

    { t:"发句「我快没电了」，然后安心关机", w:{sec:2,expr:2,gSec:1} },

/* ================= 结果库 =================
   4 大依恋基底 × 9 种人设 = 36 个结果。
   gate 为硬门槛分组：sec 安全 / anx 焦虑 / avo 回避 / fear 混乱。 */
const CITIES = [
  /* ---- 安全型 · 低焦虑低回避 ---- */
  { name:"稳稳接住的人", sub:"安全型 · 低焦虑低回避", gate:"sec", tags:["情绪稳定","能沟通","不内耗"],
    v:{"sec":3,"anx":-2,"avo":-2,"conf":2,"expr":2,"bound":1,"verify":-2},
    copy:"【你大概是这样】\n你不用靠猜测确认被爱。对方没回消息，你默认他在忙而不是在生气；自己不舒服会直接说，说完就翻篇，不攒着当证据。关系对你更像一个可以放心待着的地方，不是一份天天要续签的合同。\n\n【一个很具体的场景】\n周五七点，对方发来「临时加班，电影改天吧」。你回「没事，正好把那部剧追完」，然后真去洗澡、点外卖、看了两集，中间没点开对话框，也没在九点补一句「你是不是不太想来」。第二天他问「昨天没生气吧」，你是真愣了一下：为什么会生气？\n\n【为什么会这样】\n你把「暂时没联系」和「关系出问题」分开存放，所以不需要靠频繁回应来续命。这不是迟钝，是心里那根底线稳，不用每件事都拿去验一次。\n\n【你的亮点】\n· 情绪不连环：一件事就是一件事，吵完不翻旧账，也不把上周那句气话留到这周用。\n· 会开口要，也接得住：想被陪就直说「这周想见一面」，对方情绪不好时也不急着辩解。\n\n【适合什么样的人】\n适合同样松弛、愿意把话摊开讲的人，尤其是那些在别的关系里被反复求证消耗过的——你不用他猜，他就不用一直证明，两个人都省下力气过日子。容易被忽冷忽热吸引的人反而会觉得你「不够刺激」。\n\n【小缺点】\n稳到有点没有剧情。想被热烈追求、靠心跳确认「他到底多喜欢我」的人，容易把你的平静读成没那么上心——你只是没慌，人家却觉得你没在意。\n\n【给你的两条建议】\n· 平静之外偶尔补一句直白的「挺想你的」「今天见到你很开心」，对你只是陈述，对对方是定心丸。\n· 被问「真的没生气吗」时别只答「没有」，加一句「我为什么会生气」，把你的默认逻辑讲给他听。\n\n【一句话】\n温柔是真的，不够上头也是真的；可被你接住的人，多半不想再去别处找刺激了。" },
  { name:"清醒的长期主义者", sub:"安全型 · 慢投入重兑现", gate:"sec", tags:["不画饼","看行动","长期主义"],
    v:{"sec":3,"imp":-2,"ideal":-3,"bound":3,"conf":2,"avo":1},
    copy:"【你大概是这样】\n心动归心动，你不会因为三天热聊就把未来全押上去。你看的是对方说过的有没有做到、遇事能不能一起扛，节奏慢但走得稳。别人谈感觉，你悄悄记账。\n\n【一个很具体的场景】\n认识两周，对方说「以后一起去旅行吧」，你笑着没接话。心里记下的却是上周三那句「我晚上给你打电话」——后来打了，还迟了十分钟但解释了原因。你给这段关系加分，加在这一件小事上，不是那句旅行。\n\n【为什么会这样】\n你相信行为比语言难伪造，所以本能地等三次兑现再往前走一步。不是冷，是你不想把判断押在最容易说的那部分上。\n\n【你的亮点】\n· 不画饼也不吃饼：很少被漂亮话带跑，也很少让别人替你收拾期待落空。\n· 兑现力强：答应了的事基本会做到，长期相处很让人安心。\n\n【适合什么样的人】\n适合不玩推拉、说到做到的人，以及同样慢节奏、不急着要名分的。最怕的是靠高频甜言蜜语推进关系的人，会觉得你一直在「面试」他。\n\n【小缺点】\n开场有点冷。人家剧本都写到第三幕了，你还在做背景调查；等你觉得可以开始了，对方往往已经撤了。\n\n【给你的两条建议】\n· 把「我在观察」说出口，比如「我比较慢，但我记着你说过的话」，别让沉默被读成没兴趣。\n· 每兑现一次就给一个小的确定回应，让对方知道进度条在动。\n\n【一句话】\n慢不是没心动，是你想看看这份心动能不能活过第三个星期。" },
  { name:"直球但不黏人", sub:"安全型 · 高表达高边界", gate:"sec", tags:["有话直说","不查岗","留白感"],
    v:{"expr":3,"sec":2,"bound":2,"solo":2,"anx":-3,"verify":-2},
    copy:"【你大概是这样】\n想要什么就说，不高兴也当场说，说完该干嘛干嘛，不附带查岗和复盘。你给的关系很省力，对方不用猜谜，也不用随时证明什么。\n\n【一个很具体的场景】\n对方问「周末想去哪」，你说「想去看那个展，你不想去我自己去也行」，然后就真的去查了开放时间。没有补一句「你是不是不想陪我」，也没有在对方回「都行」之后对着这两个字琢磨一晚上。\n\n【为什么会这样】\n你把「表达需求」和「索取保证」当成两件事：前者说完就结束，后者才会拖出一串追问。你只做前者，所以关系里几乎没有暗账。\n\n【你的亮点】\n· 不让人猜：省下来的沟通成本，两个人都能拿去过日子。\n· 不查岗：给得出留白，对方不用靠报备换平安。\n\n【适合什么样的人】\n适合同样不爱内耗、听完就去做的人；也适合曾经被「你猜」折磨过的。需要靠推拉确认心意的人，反而会觉得少了点拉扯的乐趣。\n\n【小缺点】\n直球偶尔砸得太准。对方还没准备好听实话，你已经把结论念完了，连缓冲都没留；有时候真相没错，时机太早。\n\n【给你的两条建议】\n· 结论前面加一句铺垫：「我有个想法，你先听听」。\n· 允许对方说「我再想想」，别把没立刻回应读成不同意。\n\n【一句话】\n你给的省力，是很多人第一次知道原来关系可以不累。" },
  { name:"会吵架也会和好", sub:"安全型 · 冲突修复力强", gate:"sec", tags:["不冷战","当天翻篇","抗压"],
    v:{"conf":3,"expr":3,"sec":2,"avo":-2,"sac":-2},
    copy:"【你大概是这样】\n你不怕吵，因为你知道吵完不等于要散。情绪上头时还能留一句「我不是针对你」，事后也不翻旧账。冲突对你是一道要解的题，不是一场要赢的仗。\n\n【一个很具体的场景】\n吵到一半，你说「我现在有点气，但没想分手，等我十分钟」，然后真去阳台站了十分钟。回来接着聊刚才那件事，没把上周的旧账一起端上桌，也没冷战到第二天。\n\n【为什么会这样】\n你心里把「这件事我们意见不同」和「我们还要不要在一起」分得很开，所以吵得起来，也收得回去。修复力不是脾气好，是底线稳。\n\n【你的亮点】\n· 不冷战：悬着的时间很短，对方不用猜「是不是完了」。\n· 当天翻篇：不攒暗账，问题说完就真的过去。\n\n【适合什么样的人】\n适合愿意一起解决问题、吵完还肯坐下来的人。最怕需要缓一整晚、靠沉默整理情绪的类型，你会忍不住去敲门。\n\n【小缺点】\n你对冷战的耐受度低到近乎没耐心。遇上需要缓一晚的人，你追得越紧，人家越想躲，最后变成你追着要修复。\n\n【给你的两条建议】\n· 把「多久之后聊」交给对方定一次，你只负责到点回来。\n· 别在气头上追结论，先给一句「不急，明天说也行」。\n\n【一句话】\n你不是不吵，是吵完还记得我们是一伙的。" },
  { name:"慢热但耐久", sub:"安全型 · 低冲动高续航", gate:"sec", tags:["慢热","后劲足","不折腾"],
    v:{"sec":2,"imp":-3,"ideal":-2,"bound":2,"solo":1,"rom":-1},
    copy:"【你大概是这样】\n前三个月你看起来有点淡，不是没感觉，是在确认能不能长期待下去。一旦认定，反而比谁都耐得住，热度不靠惊喜维持，靠日常一点点续。\n\n【一个很具体的场景】\n头两个月约会都准时，但从不越界、也不说漂亮话。第三个月对方发烧，你下班绕路把药和粥送到门口，发了句「放门口了，记得吃」，没多说一个字，第二天又准时问了一句退烧没。\n\n【为什么会这样】\n你的投入需要先过「能不能长久」这一关，过了之后就不再反复称量。慢的是启动，不是心意。\n\n【你的亮点】\n· 后劲足：别人的热度靠新鲜感，你靠习惯和兑现。\n· 不折腾：不靠忽冷忽热制造起伏，相处成本很低。\n\n【适合什么样的人】\n适合不追求轰轰烈烈、愿意给时间的人。靠前两周的浓烈判断关系的人，常常在你热身完之前就走了。\n\n【小缺点】\n开头太温，常被误会成「礼貌性回应」。等对方撤了，你才刚热身完，这段就常常停在最好看的地方。\n\n【给你的两条建议】\n· 前三次见面主动给一个明确信号，哪怕只是「今天挺开心，下次还约」。\n· 把「我挺喜欢和你待着」说出口，别全指望行动替你翻译。\n\n【一句话】\n你不是慢，是把火留着烧很久。" },
  { name:"边界清楚的温柔", sub:"安全型 · 高边界低牺牲", gate:"sec", tags:["有分寸","不委屈","会拒绝"],
    v:{"bound":3,"sec":2,"expr":2,"avo":1,"sac":-3,"anx":-2},
    copy:"【你大概是这样】\n你可以很体贴，但不会用委屈自己来换关系稳定。哪件事不舒服、哪块时间要留给自己，说得清楚也守得住。拒绝你做得很温和，但真的很拒绝。\n\n【一个很具体的场景】\n对方想替你推掉周末的朋友聚会，说「你那几个朋友下次再约嘛」。你笑了一下：「这个我自己去，你晚上来接我就行。」语气没一点火气，安排也没改。后来他真来接了，一路都挺高兴。\n\n【为什么会这样】\n你把「照顾对方」和「交出自己」分开，所以体贴不附带代价。边界对你不是墙，是让关系能长久不积怨的通风口。\n\n【你的亮点】\n· 不委屈自己换稳定：少了很多日后翻出来的旧账。\n· 会拒绝也不伤人：说不留情面的是内容，不是语气。\n\n【适合什么样的人】\n适合尊重边界、不把「被需要」当证明的人。想全程照顾你、并把拒绝读成疏远的人，会有点无处着力。\n\n【小缺点】\n你的「不用了，真的」太利落，偶尔让想照顾你的人扑个空，好意没处放，久了对方会不太敢主动。\n\n【给你的两条建议】\n· 拒绝时顺手给一个替代方案，让好意有落点。\n· 偶尔收下一次对方的小心意，被照顾不等于欠了谁。\n\n【一句话】\n你的温柔有骨头，所以才不累。" },
  { name:"先把自己过好", sub:"安全型 · 独处自洽", gate:"sec", tags:["自洽","不依赖","低需求感"],
    v:{"solo":3,"bound":3,"sec":2,"imp":-2,"rom":-1,"anx":-2},
    copy:"【你大概是这样】\n恋爱对你更像锦上添花，不是补洞。你有自己的节奏、朋友和安排，对方来是加分，不来也不塌。你不太会从关系里找存在感。\n\n【一个很具体的场景】\n对方出差一周，你把这一周排满了健身、朋友饭、没看完的书。视频时他问「想我不想」，你笑着说「我这周还挺忙的哈」，没有一句「你怎么还不回来」。挂了电话你继续把书架重排了一遍，确实没觉得缺什么。\n\n【为什么会这样】\n你的日常本身是满的，恋爱是加进来的一块，不是拿来堵空的那块。所以你不容易慌，也不太需要靠对方回应来确认自己过得怎么样。\n\n【你的亮点】\n· 不靠恋爱补洞：情绪自给，关系里很少索取式拉扯。\n· 稳定可靠：自己的事自己兜得住，不会把压力全转给对方。\n\n【适合什么样的人】\n适合同样有自己生活、不需要天天黏着的人。把「被需要」当成被爱证据的人，会在你这里找不到入口。\n\n【小缺点】\n需求感低到有点让人没成就感，对方偶尔会小声问一句：那我到底能为你做点什么？\n\n【给你的两条建议】\n· 主动提一个具体要求，哪怕只是「周五陪我吃顿饭」。\n· 让对方参与一次你的安排，被放进生活里，比被安慰更让人安心。\n\n【一句话】\n你来是加分不是填空；但偶尔让他加一次分，他会很开心。" },
  { name:"不猜谜星人", sub:"安全型 · 拒绝反复求证", gate:"sec", tags:["不内耗","要明牌","轻装上阵"],
    v:{"expr":3,"conf":2,"sec":2,"verify":-3,"ideal":-2,"anx":-2},
    copy:"【你大概是这样】\n你基本不玩「他这句话什么意思」，也不靠点赞和已读推测人心。有疑问就问，问完就放下，关系里省下来的力气拿去过日子。\n\n【一个很具体的场景】\n对方发了三个字「随便吧」。你没对着这三个字复盘一晚上，直接回：「是有点不高兴吗？说一句我就知道了。」他回「今天被领导说了」，你「哦」了一声，转头聊起晚上吃什么。事情就结束了。\n\n【为什么会这样】\n你不把沉默当谜题，默认「没说出口的可以问」。省掉的不是敏感，是把敏感反复空转的那部分。\n\n【你的亮点】\n· 不内耗：一个疑问只走一趟，不来回碾。\n· 要明牌：对方不用练暗示，也不用怕哪句被过度解读。\n\n【适合什么样的人】\n适合同样明牌、有话说话的人。靠铺垫和暗示表达喜欢的人，会觉得你太直、少了点余味。\n\n【小缺点】\n你对暗示类浪漫有点钝。别人铺垫了三天的惊喜，你一句「直接说呗」就给拆了，心意还在，仪式感没了。\n\n【给你的两条建议】\n· 惊喜被拆穿之前，先说一句「谢谢你想了这么久」。\n· 别急着要答案，有些话人家就是想慢慢说。\n\n【一句话】\n你把力气省下来过日子，只是别忘了有人靠铺垫表达喜欢。" },
  { name:"松弛感选手", sub:"安全型 · 低焦虑低戒备", gate:"sec", tags:["不紧绷","好相处","自然"],
    v:{"sec":3,"anx":-3,"avo":-1,"verify":-2,"conf":1,"solo":1,"rom":1},
    copy:"【你大概是这样】\n和你待着不太用使劲，不用报备、不用表演、也不用随时证明什么。你默认关系是稳的，这份默认本身就让双方都松下来。\n\n【一个很具体的场景】\n两个人各自看手机看了快一小时，谁都没说话。你起身倒水，顺手给对方也倒了一杯放在旁边，然后坐回去继续看。没有人觉得需要解释一句「我们是不是没话说了」，那一小时一点也不尴尬。\n\n【为什么会这样】\n你不把安静当警报，也不把「没互动」自动翻译成「变淡了」。关系在你心里是常驻的，不需要每分钟刷新一次存在感。\n\n【你的亮点】\n· 不用报备：对方有完整的呼吸空间。\n· 不表演：不用维持一个「很恩爱」的样子给谁看。\n\n【适合什么样的人】\n适合容易被紧绷关系消耗的人，以及同样能享受各做各的事的。需要高频确认和密集互动的人，可能会把这份松读成冷。\n\n【小缺点】\n松到偶尔显得没在在意。对方想被紧张一下的时候，你还在慢悠悠倒水，那杯水很好，但不太解渴。\n\n【给你的两条建议】\n· 偶尔主动制造一点「特意」：买他提过的那款酸奶就行。\n· 对方明显不安时，先给一句确认，别等他自己想通。\n\n【一句话】\n和你待着不用使劲，这本身就是很稀有的本事。" },

  { name:"消息秒回侦察兵", sub:"焦虑型 · 高确认需求", gate:"anx", tags:["高敏感","要回应","实时在线"],
    v:{"verify":3,"anx":3,"solo":-2,"imp":1,"bound":-2},
    copy:"【你大概是这样】\n你对回应的雷达特别灵，语气一变、间隔一长就立刻能察觉。这不是作，是你把「还联系着」当成关系还在的证据，所以一旦断档，第一反应是去找原因。\n\n【一个很具体的场景】\n晚上 9:47 你发了句「到家了吗」。9:55 没回，你把对话框点开一次；10:02 还没回，你看见他半小时前给共同好友点了赞，于是「到家了吗」这四个字被你在心里重读了三遍，连标点都检查了一遍——是不是显得太急了。\n\n【为什么会这样】\n不是不信任，是你的安全感靠「实时在线」供电。一断档，脑子就自动开始补剧情，而最先被怀疑的永远是自己那句是不是说错了。\n\n【你的亮点】\n· 感知力极强：对方没说出口的低落，你常常比他自己先发现。\n· 很会照顾人：因为你太知道等一条消息是什么滋味，所以不忍让别人等。\n\n【适合什么样的人】\n适合愿意主动给确定感、不嫌你问的人，最好是会顺手报备一句「我开会，两小时后回」的类型。忽冷忽热、把消失当情趣的人会把你耗空。\n\n【小缺点】\n刷新聊天框的那几秒真的挺累的。对方只是开了个会，你已经把三种结局想完了，还得装作只是随口一问。\n\n【给你的两条建议】\n· 给自己定个「十五分钟规则」：没回就先去洗澡或出门扔垃圾，回来再看。\n· 把「你刚在忙吗」换成「我看到啦，不急」，给对方也给自己留一口气。\n\n【一句话】\n你要的不是秒回，是「我还被放在心上」这句话能有个地方落地。" },
  { name:"已读不回受害者", sub:"焦虑型 · 落差敏感", gate:"anx", tags:["怕落差","会复盘","细节控"],
    v:{"anx":3,"verify":2,"ideal":-1,"sac":2,"conf":-1},
    copy:"【你大概是这样】\n你最难受的不是没人回，是「明明之前不是这样」。热情的落差你第一时间就能量出来，然后开始往上翻聊天记录，逐句找自己哪句说错了。\n\n【一个很具体的场景】\n之前每天午休都有语音，这周连着三天只有「嗯」「好」。你把记录翻回最初，对比哪一句开始变短，最后停在三天前自己发的那个玩笑上——是不是那句太吵了。其实那天他只是加班到十一点，回完「好」就趴在桌上睡着了。\n\n【为什么会这样】\n你把「回应密度的变化」当成关系温度计的读数，所以一降温就本能地归因到自己身上。可温度计有时候只是被人顺手放到了别处。\n\n【你的亮点】\n· 落差敏感，也意味着你对「被好好对待」的细节记得很清楚。\n· 会复盘：愿意先检查自己，而不是第一时间指责对方。\n\n【适合什么样的人】\n适合稳定、表达前后一致的人，尤其是忙之前会先说一声的那种。节奏忽快忽慢、靠心情决定热情的人，会让你一直处在校对状态。\n\n【小缺点】\n你把对方的疲惫也读成了自己的错。人家只是那天累到不想说话，你却已经给整段关系写好了检讨。\n\n【给你的两条建议】\n· 察觉落差时先问一句「最近是不是比较累」，把猜测换成事实核对。\n· 给「变淡」设一个观察期（比如一周），别用单日读数下结论。\n\n【一句话】\n你最难受的不是没人回，是「明明之前不是这样」；其实那天他只是加班到十一点。" },
  { name:"反复确认爱好者", sub:"焦虑型 · 求证循环", gate:"anx", tags:["要明话","怕悬着","反复问"],
    v:{"verify":3,"anx":2,"expr":1,"bound":-3,"sec":-2},
    copy:"【你大概是这样】\n你不是不信对方，是不信「没说出口」的那部分，所以需要一遍遍把话落到明处才踏实。问清楚了你就立刻好，这点其实挺好哄。\n\n【一个很具体的场景】\n对方说「我挺喜欢你的」，你当时笑了，睡前又发了一句「你刚那是随口说的吧」；得到差不多的答案，第二天中午又提了一次，才真的把心放回肚子里。第三次他没烦，只是回了个「我在呢，别怕」。\n\n【为什么会这样】\n口头确认对你像一张临时收据，过一阵就自动作废，得重新开一张。要的不是新信息，是那份「现在还作数」的感觉。\n\n【你的亮点】\n· 好哄：一句明话就能让你从纠结里出来，不翻旧账。\n· 要的是明话不是承诺，门槛其实不高，也从不拿答案去要挟谁。\n\n【适合什么样的人】\n适合耐心、愿意把话讲透的人，以及会主动重复表达的类型。把「我说过一次了」当结束语的人，会让你越问越不安。\n\n【小缺点】\n同一件事问到第三遍，对方会从安慰切换成叹气——不是不爱，是电量也有限；而那一声叹气，又会被你收进下一轮的不安里。\n\n【给你的两条建议】\n· 把对方说过的原话记进备忘录，想再问时先读一遍自己的记录。\n· 换一种问法：不说「你真的吗」，说「我今天有点不安，陪我聊十分钟」，让需求直接落地。\n\n【一句话】\n你缺的不是答案，是一个能反复安放不安的地方。" },
  { name:"一上头就全给", sub:"焦虑型 · 高投入高滤镜", gate:"anx", tags:["上头快","全情投入","不设防"],
    v:{"imp":3,"ideal":3,"sac":3,"bound":-3,"sec":-2},
    copy:"【你大概是这样】\n喜欢来得又快又满，你会把时间、计划和盘托出，恨不得一次把心意交完。这份热烈是真心，也很动人，只是常常跑在关系前面。\n\n【一个很具体的场景】\n认识十天，你已经把下个月的周末全空出来、挑好了他生日要送的东西、连见家长怎么开口都想好了。而他只是在饭桌上说了句「下次带你去吃那家店」。\n\n【为什么会这样】\n你一心动就把未来和当下合并处理了，脑子里那个「我们」比现实里的进展快了两章。不是不清醒，是投入本身让你太快乐，舍不得踩刹车。\n\n【你的亮点】\n· 热烈是真心，不掺算计，对方不用猜你有没有意思。\n· 愿意花心思：你会把关系里的小事都安排得妥帖。\n\n【适合什么样的人】\n适合接得住、不会因此拿捏你的人，最好节奏稳、会主动把「以后」落到具体时间。喜欢吊着人、享受被追的人，最容易接住你这份满。\n\n【小缺点】\n你给得太早，对方还没走到那一步，你已经在替两个人做决定，后面常常只剩一个人尴尬。\n\n【给你的两条建议】\n· 每次想加码前，先问一句「这一步是两个人一起迈的吗」。\n· 计划里留一格空白，让对方有机会先开口，你再跟上。\n\n【一句话】\n你的心意很贵，别在对方还没伸手的时候就全放到桌上。" },
  { name:"情绪先行派", sub:"焦虑型 · 感受优先", gate:"anx", tags:["真性情","来得快","不装"],
    v:{"imp":2,"anx":3,"conf":-1,"expr":2,"sec":-1},
    copy:"【你大概是这样】\n你不太藏得住，开心和委屈都写在脸上，吵完最先绷不住的也常常是你。好处是关系里几乎没有暗账，坏处是当下那一句往往比本意重。\n\n【一个很具体的场景】\n因为一句「你先忙吧」当场眼眶就红了，脱口「那你以后都别找我了」；半小时后自己发「我刚不是那个意思」，接下来又花两倍力气解释那句到底是什么意思。\n\n【为什么会这样】\n你的感受从心里到嘴边几乎没有缓冲区，说出来那一刻是真的，后悔也是真的。不是反复无常，是两件事都发生在同一分钟里。\n\n【你的亮点】\n· 几乎没有暗账：不高兴当场就摆出来，不用攒到最后一起算。\n· 真性情，对方不用猜你此刻是高不高兴。\n\n【适合什么样的人】\n适合愿意等你把情绪放完、再回来聊事情的人。需要立刻讲道理、把情绪当麻烦的人，会让你越说越急。\n\n【小缺点】\n气头上的话收不回来，事后得花两倍力气解释「我其实不是那个意思」，解释完自己还挺累。\n\n【给你的两条建议】\n· 给自己一句固定缓冲语：「我现在有点上头，十分钟后说」，先把十分钟占住。\n· 解释时只说本意，别再复盘自己刚才有多失态，越复盘越绕。\n\n【一句话】\n你不装，所以容易伤；可被你认真对待过的人，都记得那份不装。" },
  { name:"细节考古学家", sub:"焦虑型 · 高证据敏感", gate:"anx", tags:["记细节","会对比","观察力"],
    v:{"verify":3,"ideal":2,"anx":2,"rom":1,"conf":-1},
    copy:"【你大概是这样】\n你记得住对方说过的每一句、发过的每张图，也会悄悄比对现在和当时。记忆力用在恋爱上，一半是浪漫，一半是给自己找材料。\n\n【一个很具体的场景】\n你记得他三月说过「最不喜欢被放鸽子」，也记得上周头像换了、签名从两句改成一句。深夜把这两件事连起来看了半小时，还翻出那天的日期算了算——其实它们之间什么关系都没有。\n\n【为什么会这样】\n你的脑子擅长保存细节，也擅长在细节之间连线。安静的时候线会自动连上，连得多了，随手一个小改动就像一份需要解读的声明。\n\n【你的亮点】\n· 记忆力用在人身上，是很稀缺的用心：他随口提的小事你都记得。\n· 观察细，别人忽略的变化你常常第一个察觉。\n\n【适合什么样的人】\n适合坦荡、经得起回看的人，以及表达前后一致、不玩暗示的。喜欢改状态、把心思藏在细节里的人，会让你一直加班。\n\n【小缺点】\n考古挖太深，容易把人家随手改的个签当成一份声明，再顺着这份「声明」推导出一整段剧情。\n\n【给你的两条建议】\n· 给每条发现标一个等级：事实 / 猜测，只按事实行动。\n· 猜测留到下次见面当面问一句，别在深夜独自结案。\n\n【一句话】\n你记性太好了，好到有时候替对方写了他没写过的台词。" },
  { name:"怕被丢下的人", sub:"焦虑型 · 高黏合倾向", gate:"anx", tags:["重陪伴","怕失去","很用心"],
    v:{"anx":3,"sac":3,"avo":-3,"solo":-3,"verify":2},
    copy:"【你大概是这样】\n你经营关系真的很用心，会记得对方随口提的小事，也愿意先让步。你怕的不是吵架，是忽然就没了下文。\n\n【一个很具体的场景】\n对方说「这周想自己待着」，你嘴上说好，转头把周末所有安排都取消了，怕他临时改主意你没空。结果那两天你什么也没做，就守着手机，连想吃什么都懒得想。\n\n【为什么会这样】\n你把「随时能接住对方」当成不被丢下的保险，于是把自己的日程调成了待命状态。可待命久了，连自己原本要做什么都模糊了。\n\n【你的亮点】\n· 真的很用心：记得住小事，也愿意先递台阶。\n· 不轻易让场面僵，关系里少了很多硬碰硬。\n\n【适合什么样的人】\n适合稳定、不玩消失的人，尤其是会提前说「这周我自己待，周日找你」的那种。把忽冷忽热当节奏的人最不适配。\n\n【小缺点】\n为了不被丢下，你偶尔会把自己缩得比对方需要的小一圈，日子久了连自己想吃什么都懒得报。\n\n【给你的两条建议】\n· 取消安排前先问「如果他不来，我原本想做什么」，然后照做。\n· 每周保留一件只属于自己的事，不因关系状态临时开关。\n\n【一句话】\n你怕的不是吵架，是忽然没了下文；可你自己的生活，不该跟着别人的行程表开关。" },
  { name:"先低头再说", sub:"焦虑型 · 以让步换安稳", gate:"anx", tags:["不冷战","先道歉","怕僵"],
    v:{"sac":3,"conf":-3,"anx":2,"expr":-2,"bound":-1},
    copy:"【你大概是这样】\n你最怕的不是输赢，是僵着。所以常常你先开口、先道歉、先把气氛捞回来，关系确实因此少了很多硬碰硬。\n\n【一个很具体的场景】\n明明是对方忘了纪念日，你先说了句「是我也没提醒」，气氛当场就回来了，他还松了口气。那点委屈没说出口，后来也没再提，他真以为你不在意这件事。\n\n【为什么会这样】\n你把「气氛还在」看得比「我被看见」更急，于是每次都先付那笔小的情绪成本。单次很划算，久了就变成一笔没人认领的账。\n\n【你的亮点】\n· 修复快：悬着的时间很短，关系不容易结痂。\n· 不冷战，愿意先递台阶，对方不用一个人扛僵局。\n\n【适合什么样的人】\n适合同样愿意接住台阶、并且会回头问一句「你刚刚是不是有点委屈」的人。只接台阶不回头看的人，会让你一直单方面垫付。\n\n【小缺点】\n低头低成习惯之后，有些委屈就再也没机会说出口了，对方还以为你真的没意见。\n\n【给你的两条建议】\n· 先缓和可以，但把「我还有一句想说」留在当天说完。\n· 试着让对方递一次台阶，别每次都抢着先开口。\n\n【一句话】\n你捞回来的气氛是真的，被你顺手按下去的自己也是真的。" },
  { name:"恋爱脑本脑", sub:"焦虑型 · 高冲动高滤镜", gate:"anx", tags:["全情","易上头","自带剧本"],
    v:{"imp":3,"ideal":3,"verify":2,"sac":2,"sec":-2,"bound":-2},
    copy:"【你大概是这样】\n你不是不知道该留点余地，是心动一上来就顾不上。滤镜开满、剧本写好、连退路都替对方想好了。这份投入本身很珍贵，别急着否定自己。\n\n【一个很具体的场景】\n对方随口说了句「以后养只猫吧」，你当晚已经看好了猫的品种、存了三家宠物医院的电话，连猫叫什么都想了两个备选。他第二天大概已经忘了自己说过这句。\n\n【为什么会这样】\n一句带「以后」的话，在你这里会自动展开成一整段共同生活。不是分不清现实，是想象那部分太好玩了，你舍不得先关掉。\n\n【你的亮点】\n· 全情投入、不设防，这份热烈在现在其实很稀有。\n· 愿意为关系花心思，不吝啬，也不算计谁多谁少。\n\n【适合什么样的人】\n适合真诚且节奏稳的人，最好会主动把「以后」落到具体时间。只会画饼、说完就忘的人，会让你一个人收落差。\n\n【小缺点】\n你爱上的有时候是「你想象里的他」，等真人出场，落差得你自己收，还容易怪自己看走眼。\n\n【给你的两条建议】\n· 把「以后」类的话先记下来，过两周再看他还提不提。\n· 每次上头时写下三件他实际做过的事，只按这三件下判断。\n\n【一句话】\n别急着否定自己，你只是把剧本写得比现实快了两章。" },

  { name:"需要洞穴时间", sub:"回避型 · 高独处需求", gate:"avo", tags:["要空间","慢回血","不黏"],
    v:{"avo":3,"solo":3,"bound":2,"conf":-2,"expr":-2},
    copy:"【你大概是这样】\n情绪一满你就想先退回去待一会儿。不是不在乎，是得先把自己整理好才说得出口。独处对你像充电，一个人捋顺了，你反而更能好好说话。\n\n【一个很具体的场景】\n吵完你说「我先静一静」，把手机扣过去，两小时没回消息。其实你一个人在阳台把整件事从头捋了一遍，连怎么开口都想好了，只是没发出去。对方那两小时对着一个灰头像，把最坏的两种可能都想完了。\n\n【为什么会这样】\n你的表达需要先过一遍内部整理，情绪太满时硬开口，说出来的往往不是本意。所以你选择先沉默——这是负责，只是没通知对方。\n\n【你的亮点】\n· 几乎不说气话：宁可先停，也不拿狠话当出口。\n· 会自己整理情绪，不把消化成本全转给对方。\n\n【适合什么样的人】\n适合不把安静解读成冷落的人，最好是能自己待住、也不会追着要即时答案的。需要立刻回应才安心的人，会在这两小时里很不好过。\n\n【小缺点】\n你没打招呼就进洞了。外面那位只能对着一个灰头像猜，一猜就容易猜歪，等你出洞，还得先花力气拆掉他自己写的剧情。\n\n【给你的两条建议】\n· 进洞前留一句「我需要两小时，八点回来聊」，一句话就够。\n· 出洞后主动把整理好的结论说出来，别让沉默自己收尾。\n\n【一句话】\n独处是你的充电方式，不是惩罚谁；但记得给外面的人留一盏灯。" },
  { name:"别靠太近星人", sub:"回避型 · 高边界低表露", gate:"avo", tags:["有距离","慢开放","不捆绑"],
    v:{"avo":3,"bound":3,"sec":-1,"rom":-2,"solo":2},
    copy:"【你大概是这样】\n关系一升温你就本能地留半步，太密的关心会让你有点闷。你不是不需要人，是需要「随时能退回来」的余地，那半步是你给自己留的呼吸口。\n\n【一个很具体的场景】\n对方说「以后每天晚安好不好」，你笑着应了，心里第一反应却是「每天都……有点满」。第二天开始晚回半小时，第三天把「想你」回成了一个表情。你没有不高兴，只是觉得被排满了。\n\n【为什么会这样】\n你把「固定频率的亲密」读成了「随时要在线的义务」，一旦关系变成日程，就会本能地想给自己松一格。不是冷淡，是对被捆绑的警觉。\n\n【你的亮点】\n· 不捆绑：给得出空间，也不要求对方随时配合。\n· 慢开放但一旦认定很稳，不靠高频互动维持。\n\n【适合什么样的人】\n适合同样独立、不追着要答案的人，以及各有各的节奏也能安心的。把「每天晚安」当安全感底线的人，会一直撞在你那半步上。\n\n【小缺点】\n这半步在对方眼里常常等于一整面墙。人家努力靠近，只摸到你客气的一句「都行」，久了就不敢再往前了。\n\n【给你的两条建议】\n· 把「我需要一点空间」说成具体时长：「这周三我自己待一晚，周四约」。\n· 每周主动靠近一次，别把推进全交给对方。\n\n【一句话】\n你要的不是远，是随时能退回来；可不说，对方只看见远。" },
  { name:"冷处理专业户", sub:"回避型 · 冲突回避", gate:"avo", tags:["不正面刚","先降温","慢开口"],
    v:{"avo":3,"conf":-3,"expr":-2,"solo":2,"anx":-1},
    copy:"【你大概是这样】\n场面一紧你第一反应是先降温，不急着辩，也不急着给结论。你确实很少说出伤人的话，这是本事；只是降温之后，常常就没有下文了。\n\n【一个很具体的场景】\n对方问「我们是不是该聊聊昨天」，你说「没什么好聊的，过去了」，然后话题真的就停在那儿，一停两周。你以为翻篇了，对方却把那句没说出口的话一直悬着，最后自己默默收了回去。\n\n【为什么会这样】\n你把「不激化」当成处理完了，可对方要的是一次确认：这件事我们真的过了吗。你省了冲突，也省掉了那句确认。\n\n【你的亮点】\n· 很少说伤人的话，情绪上头时也不加码。\n· 先降温不激化，给双方都留了台阶。\n\n【适合什么样的人】\n适合愿意给彼此缓冲时间、也能自己安放情绪的人。需要当场把话说透才睡得着的人，会被这份「过去了」磨到。\n\n【小缺点】\n降温降久了就变成没下文。对方等不到那句「我们聊聊」，只好自己把悬着的心收回去，久了也就不问了。\n\n【给你的两条建议】\n· 降温时给一个回来的时间：「明晚我们说十分钟」。\n· 回来只说一句「昨天那事我还想补两句」就够了，不用长篇。\n\n【一句话】\n你没把话说重，也没把话说完；悬着比吵着更磨人。" },
  { name:"独立到有点硬", sub:"回避型 · 高自持低求助", gate:"avo", tags:["自己扛","不麻烦人","可靠"],
    v:{"avo":2,"bound":3,"solo":3,"expr":-2,"sac":-3},
    copy:"【你大概是这样】\n能自己解决的绝不麻烦对方，搬家、生病、加班到深夜都处理得妥妥帖帖。跟你在一起很省心，也很有安全感，只是这份省心有时候太满。\n\n【一个很具体的场景】\n发烧 38.5，你自己叫车去医院、自己挂号挂水，回来对方才知道，急着问「怎么不叫我」。你一边量体温一边说「这点事不用」，是真觉得不用，不是客气。\n\n【为什么会这样】\n你把「不添麻烦」当成了体贴的默认形式，久了连求助这个动作都从选项里消失了。可关系里的一部分亲近，恰恰是靠互相麻烦长出来的。\n\n【你的亮点】\n· 自己扛得住，不把压力随手转给别人。\n· 跟你在一起很省心，答应了的事基本不用催。\n\n【适合什么样的人】\n适合不把「被需要」当证明的人，以及同样独立、不会因为你没叫他而多想的类型。把照顾你当成被爱证据的人，会有点没着落。\n\n【小缺点】\n你太能扛了，对方想搭把手都找不到入口，久了会怀疑自己在这段关系里是不是可有可无。\n\n【给你的两条建议】\n· 每周主动求助一次小事：「帮我挑一下这件」「陪我走十分钟」。\n· 把「不用」换成「你来陪我坐会儿就行」，给的是一个位置，不是负担。\n\n【一句话】\n能扛是本事，可被需要也是关系里的一份礼物。" },
  { name:"关系降温预警", sub:"回避型 · 稳定期易抽离", gate:"avo", tags:["怕平淡","要新鲜","会退"],
    v:{"avo":3,"imp":-2,"rom":-2,"ideal":-2,"bound":2},
    copy:"【你大概是这样】\n追求期你其实挺灵的，能聊到凌晨两点、会主动找话题。可一旦关系稳下来、变成可预期的日常，反而有点提不起劲。你不是变心，是对「被固定」有点本能警觉。\n\n【一个很具体的场景】\n确定关系三个月后，周末固定吃饭、固定散步、固定那几句聊天。你开始频繁说「今天有点累，改天吧」，也说不上哪里不好，就是觉得日子被排进了表格里，连惊喜都提前知道内容了。\n\n【为什么会这样】\n你的投入感有一部分来自「还不确定」，一旦全确定，驱动力就自动调低。你误把「可预期」读成了「被框住」，于是先悄悄往后挪。\n\n【你的亮点】\n· 追求期投入又灵动，很会制造新鲜感。\n· 不靠惯性硬撑，对关系状态诚实，不演很恩爱。\n\n【适合什么样的人】\n适合能一起给日常添点变量的人，比如每月换一家没去过的店、临时改一次路线。把稳定本身当安全感的人，会把你的退读成不爱了。\n\n【小缺点】\n你退得很安静，对方往往到很后面才发现，原来热度早就被你自己调低了；等他发现时，常常已经攒了一肚子委屈。\n\n【给你的两条建议】\n· 把「想换点花样」说出口，别用缺席表达。\n· 每月共同定一件没做过的小事，让变量进日程，而不是靠退出来换。\n\n【一句话】\n你不是变心，是把「可预期」误读成了「被固定」。" },
  { name:"嘴硬心软型", sub:"回避型 · 低表达高在意", gate:"avo", tags:["不说但记","别扭","行动派"],
    v:{"avo":3,"expr":-3,"rom":2,"sac":1,"solo":1,"conf":-2},
    copy:"【你大概是这样】\n嘴上「随便」「都行」「没必要」，其实该记的都记着，该做的也默默做了。你的在乎走行动不走嘴，而且是走了很远都不吭一声的那种。\n\n【一个很具体的场景】\n对方随口说了句想吃某家桂花糕，你下班绕了四十分钟买回来，进门只说「顺路，随手买的」，袋子还往身后藏了一下。那家店离你公司两个地铁站，方向还是反的。\n\n【为什么会这样】\n你把「说出来」当成一种会打扰对方的索取，于是宁可让行动自己说话。别扭不是不想给，是不好意思承认自己有多上心。\n\n【你的亮点】\n· 在乎走行动：记得住随口提的小事，还真的去办。\n· 不邀功，给完不要求对方立刻回应。\n\n【适合什么样的人】\n适合能从细节里读到你的人，以及不逼你表态、但会认真说一句「谢谢」的。只听字面意思、需要频繁口头确认的人，会一直收不到你的信号。\n\n【小缺点】\n读不懂的人真的读不懂。你明明端了一整碗过去，人家只收到一句「哦，随便」，还以为你压根没上心。\n\n【给你的两条建议】\n· 递东西时加一句「你上次说想吃」，一句话就能把心意签收。\n· 被说谢谢时别立刻岔开话题，让那句谢谢落地。\n\n【一句话】\n你藏得太好了，好到心意常常没人签收。" },
  { name:"一个人也很好", sub:"回避型 · 高自足低需求", gate:"avo", tags:["自足","清爽","不将就"],
    v:{"solo":3,"avo":3,"bound":2,"sec":-1,"verify":-2},
    copy:"【你大概是这样】\n你的生活本来就挺完整，恋爱不是来填空的，所以不合适的你会很干脆地不将就。这份自洽让你很少在关系里狼狈，也很少因为怕孤单而委屈自己。\n\n【一个很具体的场景】\n朋友问「怎么不找个人」，你说「我挺好的啊」。那个周末你一个人看了展、做了顿饭、把书架重排了一遍，晚上靠在沙发上，确实没觉得缺什么，也没想找谁说话。\n\n【为什么会这样】\n你的满足感有自己的来源，不依赖关系供给，所以进入关系的门槛是「加分」而不是「需要」。这很稳，但也让门槛变得不太容易被看见。\n\n【你的亮点】\n· 自洽，不靠恋爱续命，情绪不随对方回应起落。\n· 不将就：不会为了有人陪而降低标准。\n\n【适合什么样的人】\n适合同样不靠恋爱续命、各有各的生活的人。需要被强烈需要、靠密集互动确认关系的人，会在你这里找不到存在感。\n\n【小缺点】\n门槛高到有点隐蔽。别人还没搞清楚怎么回事，就已经被归到「不打扰」那一栏，连试都没试过就结束了。\n\n【给你的两条建议】\n· 有意思的人出现时，多给一次机会再下判断。\n· 偶尔把「我挺想见你」说出口，别让对方猜自己有没有被算进来。\n\n【一句话】\n你的完整是真的，只是别把门关得连敲门声都听不见。" },
  { name:"忽近忽远玩家", sub:"回避型 · 节奏不均", gate:"avo", tags:["有来有退","难预测","需要耐心"],
    v:{"avo":2,"imp":2,"bound":2,"conf":-2,"expr":-1},
    copy:"【你大概是这样】\n你靠近的时候很热，退回的时候也很彻底，中间几乎没有过渡。不是故意吊着谁，是你自己也在找那个舒服的距离，找到了就停，没找到就再动一动。\n\n【一个很具体的场景】\n周三你连着发了十几条消息、把周末都约好了；周四一整天没动静；周五又像什么都没发生一样发来一张晚霞，配一句「好看吧」。你没觉得前后矛盾，对方却把那 24 小时过了两遍。\n\n【为什么会这样】\n你的节奏跟着自己当下的电量走，不跟着关系日历走。热的时候是真热，退的时候只是没电了，可这份「没电」没有对外播报。\n\n【你的亮点】\n· 靠近时很有感染力，热起来是真的很会照顾人。\n· 不黏不捆绑，给得出呼吸空间。\n\n【适合什么样的人】\n适合节奏稳、不跟着你起伏的人，最好是有自己安排、不会因你一退就全盘重写心情的。需要稳定频率的人，会被这份不均磨得很累。\n\n【小缺点】\n这份忽近忽远落到对方身上就是过山车。坐久了再喜欢也容易晕，而且晕的人往往不好意思说，怕显得太需要你。\n\n【给你的两条建议】\n· 退之前留一句「这两天我自己待会儿」，把没电说成状态而不是态度。\n· 留意对方有没有开始跟着你的节奏忽高忽低，那是需要调整的信号。\n\n【一句话】\n你只是在找舒服的距离，可对方坐的是过山车。" },
  { name:"承诺过敏体质", sub:"回避型 · 抗拒被定义", gate:"avo", tags:["不急着定","怕被框","重自由"],
    v:{"avo":3,"imp":-3,"ideal":-2,"sec":-2,"bound":3},
    copy:"【你大概是这样】\n一听到「我们以后」「要不要确定关系」，你会先想退半步。不是没感情，是怕一旦被定义，自由和退路就都没了。你宁可让关系一直保持「挺好」的状态。\n\n【一个很具体的场景】\n对方问「我们要不要正式在一起」，你没说不愿意，只说「别急着定义吧，这样不是挺好」，然后顺手把话题岔到下周吃什么。那顿饭后来吃得很愉快，只是那个问题再没被提起来。\n\n【为什么会这样】\n你把「定义」和「交出选择权」绑在了一起，一被命名就觉得门在身后关上。你要保住的不是别人，是自己随时能走的那条路。\n\n【你的亮点】\n· 不轻易许诺，但说了就基本会做到。\n· 重自由，也不拿名分去捆绑对方。\n\n【适合什么样的人】\n适合愿意慢慢走、不催答案的人，以及自己也不急着把关系归档的。需要在明确身份里才安心的人，会一直站在门外等。\n\n【小缺点】\n等的人也有保质期。你不给时间表，人家很难一直举着手站在原地；而且岔开话题次数多了，会被读成「其实不想」。\n\n【给你的两条建议】\n· 把「不定义」换成具体的：「我需要再相处两个月，我在意的是相处本身」。\n· 给一个可核对的小节点，比如「下个月我们再说一次」，让等待有个落点。\n\n【一句话】\n你怕的是被框住，对方怕的是一直悬着。" },
  /* ---- 混乱型 · 高焦虑 + 高回避 ---- */
  { name:"想靠近又想逃", sub:"混乱型 · 趋避同时拉满", gate:"fear", tags:["拧巴","高敏感","很累"],
    v:{"anx":2,"avo":2,"sec":-2,"conf":-2,"bound":1},
    copy:"【你大概是这样】\n你最矛盾的时刻是：特别想被抱住，真被靠过来又想先挪开一点。两种冲动都是真的，谁也没在演，所以你比谁都累。\n\n【一个很具体的场景】\n对方伸手想抱你，你往前迈了半步又停住，最后只是轻轻碰了下他胳膊，说了句「有点热」。其实那一刻你特别想被抱住，也已经在心里把自己骂了一遍：怎么又这样。\n\n【为什么会这样】\n「靠近」和「自我保护」在你身上同时在线，而且音量差不多大。不是犹豫不决，是两套反应都太灵，谁也没法先按下另一个。\n\n【你的亮点】\n· 敏感，能同时听见自己两边的声音，不硬装成只有一种情绪。\n· 不敷衍：给出去的每一步都是真的，没有随口应付。\n\n【适合什么样的人】\n适合极有耐心、给得稳又不逼的人，最好是不把你的后撤当拒绝、也不会赌气跟着退的。急着要一个明确态度的人，会让你更拧。\n\n【小缺点】\n你自己都没决定要哪边，对方就更难猜了，只好站在原地陪你反复。久了对方不敢再伸手，而你会把这份不敢读成「果然」。\n\n【给你的两条建议】\n· 把「我不知道」直接说出来，比用动作表达清楚得多。\n· 给一个最小可执行的动作，比如「先牵手十分钟」，不用一步到位选边。\n\n【一句话】\n两种冲动都是真的，所以你比谁都累；但不用立刻选一边。" },
  { name:"反复横跳选手", sub:"混乱型 · 决策来回", gate:"fear", tags:["易反复","当下为真","难捉摸"],
    v:{"anx":2,"avo":2,"imp":2,"conf":-2,"expr":-1},
    copy:"【你大概是这样】\n上午觉得就是这个人了，晚上又想算了还是一个人好，第二天看见消息又心软。你不是善变，是每次都真的那么觉得。\n\n【一个很具体的场景】\n上午发「周末见吧，好期待」，晚上发「要不还是算了，我最近状态不好」，第二天早上又问「你周末有空吗」。对方把三条消息看了两遍，最后只回了一句「你定，我都行」——他不是不在意，是跟不上了。\n\n【为什么会这样】\n你的判断很跟着当下的状态走，状态一变，结论就跟着重写。每一版都是真心，只是没留一个「暂不生效」的中转站。\n\n【你的亮点】\n· 当下为真，不敷衍、不硬撑一个已经不想要的决定。\n· 愿意改口，比闷着不说要诚实得多。\n\n【适合什么样的人】\n适合不急着要结论、也不把改主意当冒犯的人。需要提前一周把日程定死的人，会被这份来回耗到没脾气。\n\n【小缺点】\n横跳的成本最后都落在对方身上。人家刚跟上你的节奏，你已经翻到下一页，久了就干脆不跟了。\n\n【给你的两条建议】\n· 重大决定给自己 24 小时冷却，冷却期内不对外发结论。\n· 把「我改主意了」提前说成「我还在想」，让对方知道这是过程不是终点。\n\n【一句话】\n你不是善变，是每次都真的那么觉得；但对方也在真的跟着跑。" },

/* ================= 匹配模型 ================= */
/* SCORE_START */
/* g* 只用于依恋大类门控，不进余弦；COS 才是参与相似度计算的特质维度。 */
const COS = ["anx","avo","sec","imp","ideal","verify","expr","bound","solo","conf","sac","rom"];
const GATES = ["gAnx","gAvo","gSec","gFear"];
const TRAITS = COS.concat(GATES);

/* 双中心化：结果减去「平均结果」，用户减去「随机作答期望值」，只比较各自的独特性。
   不做这一步，各项都还行、没有明显短板的结果会变成 hub，吃掉大部分流量。 */
const CITY_MEAN = {};
COS.forEach(k=>{ let s=0; CITIES.forEach(c=> s += (c.v[k]||0)); CITY_MEAN[k] = s/CITIES.length; });
const CITY_C = CITIES.map(c=>{ const o={}; COS.forEach(k=> o[k] = (c.v[k]||0) - CITY_MEAN[k]); return o; });

const USER_MEAN = {};
COS.forEach(k=>{ let s=0; QUESTIONS.forEach(q=>{ let a=0; q.o.forEach(o=> a += (o.w[k]||0)); s += a/q.o.length; }); USER_MEAN[k]=s; });

/* 依恋大类是硬门槛：明确焦虑倾向的人不该被算成回避型或安全型。
   只在「某一类明显压过其他类」时才启用，避免随机作答被误门控。 */
function regionGate(u, c){
  const gs = [u.gAnx||0, u.gAvo||0, u.gSec||0, u.gFear||0];
  const sorted = gs.slice().sort((a,b)=>b-a);
  if(sorted[0] < 4 || sorted[0] - sorted[1] < 3) return 0;
  const cat = ["anx","avo","sec","fear"][gs.indexOf(sorted[0])];
  if(c.gate === cat) return 0.06;
  const opp = {anx:"avo",avo:"anx",sec:"fear",fear:"sec"};
  if(c.gate === opp[cat]) return -0.30;
  return -0.10;
}
/* 相似度 → 展示百分比（包装值，不是概率）。调参目标：随机作答均值落在 85% 上下 */
function pctOf(sim){ return Math.max(72, Math.min(95, Math.round(58 + sim*38))); }

function computeScores(answers){
  const u = {};
  answers.forEach((a,i)=>{ if(a<0) return; const w = QUESTIONS[i].o[a].w; for(const k in w) u[k]=(u[k]||0)+w[k]; });
  const uc = {}; let nu = 0;
  COS.forEach(k=>{ uc[k] = (u[k]||0) - USER_MEAN[k]; nu += uc[k]*uc[k]; });
  nu = Math.sqrt(nu) || 1;
  return CITY_C.map((cc,i)=>{
    let dot=0, nc=0;
    COS.forEach(k=>{ dot += uc[k]*cc[k]; nc += cc[k]*cc[k]; });
    const sim = dot/(nu*(Math.sqrt(nc)||1));
    return { i, sim: sim + regionGate(u, CITIES[i]) + i*1e-6 };
  }).sort((a,b)=>b.sim-a.sim);
}
/* 恋爱脑指数：只看「上头 / 滤镜 / 迁就 / 求证」减去「清醒 / 边界 / 抽离」，独立展示，不参与匹配 */
function brainIndex(u){
  const pos = k => Math.max(0, u[k]||0);
  const neg = k => Math.max(0, -(u[k]||0));
  const heat = pos("imp") + pos("ideal")*0.9 + pos("sac")*0.8 + pos("verify")*0.7 + pos("anx")*0.6;
  const cool = pos("sec")*0.5 + pos("bound")*0.5 + pos("avo")*0.7 + neg("imp")*0.5 + neg("ideal")*0.5;
  return Math.max(6, Math.min(97, Math.round(50 + 45*(heat-cool)/(heat+cool+15))));
}
function brainNote(n){
  if(n < 30) return "清醒得有点过分了，心动之前先算过风险。";
  if(n < 55) return "会心动，但还留着一只脚踩在地面上。";
  if(n < 75) return "上头是真的，事后复盘也是真的。";
  return "理智偶尔上线，大部分时间在为爱发电。";
}
/* SCORE_END */

/* ================= 交互 ================= */
let session = null;
let idx = 0;
let answers = new Array(QUESTIONS.length).fill(-1);
const $ = id => document.getElementById(id);
const cover = $("s-cover"), quiz = $("s-quiz"), result = $("s-result");

function show(el){
  [cover,quiz,result].forEach(e=>{ e.classList.add("hide"); e.classList.remove("in"); });
  el.classList.remove("hide");
  el.classList.add("fade");
  requestAnimationFrame(()=>el.classList.add("in"));
  window.scrollTo(0,0);
}

function renderQ(){
  const q = QUESTIONS[idx];
  $("qnum").textContent = String(idx+1).padStart(2,"0") + " / " + String(QUESTIONS.length).padStart(2,"0");
  $("qbar").style.width = ((idx+1)/QUESTIONS.length*100) + "%";
  $("qtitle").textContent = q.q;
  $("btn-prev").classList.toggle("hide", idx===0);
  $("btn-back").classList.toggle("hide", idx===0);
  const box = $("opts");
  box.innerHTML = "";
  q.o.forEach((op,i)=>{
    const d = document.createElement("div");
    d.className = "opt" + (answers[idx]===i ? " on" : "");
    d.innerHTML = '<span class="dot"></span><span class="txt"></span>';
    d.querySelector(".txt").textContent = op.t;
    d.onclick = ()=>{
      answers[idx] = i;
      [...box.children].forEach(c=>c.classList.remove("on"));
      d.classList.add("on");
      $("btn-next").disabled = false;
    };
    box.appendChild(d);
  });
  $("btn-next").disabled = answers[idx] < 0;
  $("btn-next").textContent = idx===QUESTIONS.length-1 ? "看看我的结果" : "下一题";
  window.scrollTo(0,0);
}

function renderResult(){
  const list = computeScores(answers);
  const top = CITIES[list[0].i];
  const pct = pctOf(list[0].sim);
  const u = {};
  answers.forEach((a,i)=>{ if(a<0) return; const w = QUESTIONS[i].o[a].w; for(const k in w) u[k]=(u[k]||0)+w[k]; });
  const bi = brainIndex(u);
  session = { top: top, list: list, pct: pct, bi: bi };

  $("r-city").textContent = top.name;
  $("r-sub").textContent = top.sub;
  $("r-pill").textContent = "匹配度 " + pct + "%";
  $("r-brain").textContent = "恋爱脑指数 " + bi + "%";
  $("r-tags").innerHTML = top.tags.map(t=>"<span>"+t+"</span>").join("");
  $("r-index").textContent = bi + "%";
  $("r-indexbar").style.width = bi + "%";
  $("r-indexnote").textContent = brainNote(bi);
  const plain = top.copy;
  $("r-copy").textContent = plain;              /* 纯文本：供复制与结构校验 */
  $("r-copy").innerHTML = renderCopy(plain);    /* 分板块展示：真实 DOM 以此为准 */
  $("r-alt").innerHTML = list.slice(1,3).map(x=>{
    const c = CITIES[x.i];
    return '<div class="row"><b>'+c.name+'</b><i>'+pctOf(x.sim)+'% · '+c.tags[0]+'</i></div>';
  }).join("");
  show(result);
}

/* 把 【板块】 标记的长文案渲染成分板块报告；· 开头行转成要点 */
function escHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function renderCopy(text){
  return String(text||"").split(/\n\s*\n/).map(para=>{
    const lines = para.split("\n").map(x=>x.trim()).filter(x=>x!=="");
    if(!lines.length) return "";
    let head = "";
    const m = lines[0].match(/^【(.+?)】\s*(.*)$/);
    if(m){ head = m[1]; lines[0] = m[2]; }
    const body = lines.filter(x=>x!=="").map(ln=>{
      if(/^·\s*/.test(ln)) return '<div class="cp-li">'+escHtml(ln.replace(/^·\s*/,""))+'</div>';
      return '<div class="cp-t">'+escHtml(ln)+'</div>';
    }).join("");
    return '<div class="cp-block'+(head==="一句话"?" cp-quote":"")+'">'
      + (head?'<div class="cp-h">'+escHtml(head)+'</div>':'')
      + '<div class="cp-p">'+body+'</div></div>';
  }).join("");
}

$("btn-start").onclick = ()=>{ idx=0; answers.fill(-1); renderQ(); show(quiz); };
$("btn-next").onclick = ()=>{
  if(answers[idx]<0) return;
  if(idx === QUESTIONS.length-1){ renderResult(); return; }
  idx++; renderQ();
};
$("btn-prev").onclick = goBack;
$("btn-back").onclick = goBack;
function goBack(){ if(idx>0){ idx--; renderQ(); } }
$("btn-again").onclick = ()=>{ idx=0; answers.fill(-1); show(cover); };

function toast(msg){
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}
$("btn-copy").onclick = ()=>{
  const txt = "我的恋爱依恋人设是「" + $("r-city").textContent + "」（" + $("r-sub").textContent + "）\n"
    + $("r-pill").textContent + " · " + $("r-brain").textContent + "\n\n"
    + (session ? session.top.copy : "");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast("文案已复制")).catch(()=>toast("复制失败，可长按选中文字"));
  }else{
    const ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("文案已复制"); }catch(e){ toast("复制失败"); }
    document.body.removeChild(ta);
  }
};
